[package]
name = "bumblebee"
version = "0.1.0"
edition = "2021"
description = "Bumblebee - a full Rust browser engine foundation"
license = "MIT"

[dependencies]
url = "2"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
