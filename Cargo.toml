[package]
name = "bumblebee"
version = "0.2.0"
edition = "2021"
description = "Bumblebee - an independent browser engine written in Rust"
license = "MIT"

[dependencies]
url = "2"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
cssparser = "0.35"
selectors = "0.26"
bytes = "1"
http = "1"
sha2 = "0.10"
percent-encoding = "2"
parking_lot = "0.12"
