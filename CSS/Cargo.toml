[package]
name = "bumblebee-renderer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bumblebee-renderer"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
