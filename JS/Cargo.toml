[package]
name = "bumblebee-js"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bumblebee-js"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.14", features = ["loader"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
